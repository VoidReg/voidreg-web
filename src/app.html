<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="text-scale" content="scale" />
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="%sveltekit.assets%/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" sizes="180x180" />
    <link rel="icon" type="image/png" sizes="192x192" href="%sveltekit.assets%/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="%sveltekit.assets%/icon-512.png" />
    <script>
      (() => {
        const name = 'voidreg-theme';
        const readCookie = (key) => {
          const prefix = key + '=';
          for (const part of document.cookie.split(';')) {
            const trimmed = part.trim();
            if (trimmed.startsWith(prefix)) {
              return decodeURIComponent(trimmed.slice(prefix.length));
            }
          }
          return '';
        };
        let saved = readCookie(name);
        if (saved !== 'light' && saved !== 'dark') {
          saved = '';
          try {
            const migrated = localStorage.getItem(name);
            if (migrated === 'light' || migrated === 'dark') {
              saved = migrated;
              const secure = location.protocol === 'https:' ? '; Secure' : '';
              document.cookie =
                name +
                '=' +
                encodeURIComponent(saved) +
                '; Path=/; Max-Age=31536000; SameSite=Lax' +
                secure;
              localStorage.removeItem(name);
            }
          } catch {
            /* private mode or blocked storage */
          }
        }
        const dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.classList.toggle('dark', dark);
        document.documentElement.classList.toggle('light', !dark);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
